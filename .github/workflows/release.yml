name: Release

# Push a tag to publish a release with installers and auto-update files: a minor or major version (v0.3.0,
# v1.0.0) is built for Windows, macOS and Linux, a patch (v0.2.3) for Windows only. Run by hand to get test
# installers as workflow artifacts (no release); "platforms" picks Windows only or all three.
# Before the first tag: generate keys (npm run tauri signer generate -- -w key.key), paste the public key into
# src-tauri/tauri.release.conf.json, and add the private key as repository secrets
# TAURI_SIGNING_PRIVATE_KEY (file content) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty if no password).
# The tag version must match "version" in src-tauri/tauri.conf.json.
# Per-OS settings (bundle formats, the macOS window) live in src-tauri/tauri.<os>.conf.json.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which systems to build
        type: choice
        options: [windows, all]
        default: windows
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Which systems this run builds: vX.Y.0 and "all" -> every OS, anything else -> Windows.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          win='{"os":"windows-latest","name":"windows","args":"","rust-targets":""}'
          # One universal app for Apple Silicon and Intel Macs.
          mac='{"os":"macos-latest","name":"macos","args":"--target universal-apple-darwin","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin"}'
          # The oldest supported Ubuntu: an AppImage built here runs on newer distributions too.
          lin='{"os":"ubuntu-22.04","name":"linux","args":"","rust-targets":""}'
          all=""
          if [ "$REF_TYPE" = tag ]; then
            if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then all=1; fi
          elif [ "$PLATFORMS" = all ]; then
            all=1
          fi
          if [ -n "$all" ]; then list="[$win,$mac,$lin]"; else list="[$win]"; fi
          echo "matrix={\"include\":$list}" >> "$GITHUB_OUTPUT"
          echo "Building for: $(echo "$list" | grep -o '"name":"[a-z]*"' | cut -d'"' -f4 | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    strategy:
      # One OS failing must not cancel the others: the release still gets what was built.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Shared with warm-cache.yml: tag builds restore the dependencies compiled on main.
          shared-key: ${{ matrix.name }}-release
          # Tags can't share their cache with other tags, so only main (warm-cache.yml) saves it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Worklog Tracker {0}', github.ref_name) || '' }}
          releaseDraft: false
          includeUpdaterJson: true
          args: --features updater --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
      # A manual run has no release to attach to: keep the installers on the run page instead.
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: worklog-tracker-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
