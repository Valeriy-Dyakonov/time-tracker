name: Warm Rust cache

# Release builds run on tags, and a tag can only read caches saved on itself or on the default branch.
# This job compiles the release dependencies on main and saves them, so tag builds skip that work.
# It runs only when dependencies change (or by hand); the cache key matches the release job via shared-key.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - .github/workflows/warm-cache.yml

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            build: cargo build --release --features updater,tauri/custom-protocol
          # The release job builds a universal app: both architectures, each in its own target folder.
          - os: macos-latest
            name: macos
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build: |
              cargo build --release --features updater,tauri/custom-protocol --target aarch64-apple-darwin
              cargo build --release --features updater,tauri/custom-protocol --target x86_64-apple-darwin
          - os: ubuntu-22.04
            name: linux
            build: cargo build --release --features updater,tauri/custom-protocol
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.name }}-release
      # tauri::generate_context! needs the frontend folder to exist; an empty page is enough to compile.
      - run: mkdir dist && echo "<!doctype html>" > dist/index.html
        shell: bash
      # Same features `tauri build --features updater` uses, so the cached dependencies match.
      - run: ${{ matrix.build }}
        working-directory: src-tauri
