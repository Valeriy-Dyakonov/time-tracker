name: Release Windows

# Run manually to get a test installer, or push a tag like v0.2.0 to publish a release with auto-update files.
# Before the first tag: generate keys (npm run tauri signer generate -- -w key.key), paste the public key into
# src-tauri/tauri.release.conf.json, and add the private key as repository secrets
# TAURI_SIGNING_PRIVATE_KEY (file content) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty if no password).
# The tag version must match "version" in src-tauri/tauri.conf.json.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Worklog Tracker {0}', github.ref_name) || '' }}
          releaseDraft: false
          includeUpdaterJson: true
          args: --features updater --config src-tauri/tauri.release.conf.json