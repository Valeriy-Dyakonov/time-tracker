[package]
name = "worklog-tracker"
version = "0.1.1"
edition = "2021"

[lib]
name = "worklog_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"
futures = "0.3"
urlencoding = "2"
roxmltree = "0.20"
tokio = { version = "1", features = ["net", "time", "io-util"] }
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
# Release builds with auto-update: `tauri build --features updater --config src-tauri/tauri.release.conf.json`.
# Without it the updater plugin is not started, so dev and plain builds need no keys.
updater = []

[profile.release]
opt-level = "s"
lto = true
