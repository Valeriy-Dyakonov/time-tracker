[package]
name = "worklog-tracker"
version = "0.7.1"
edition = "2021"

[lib]
name = "worklog_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "query"] }
chrono = "0.4"
futures = "0.3"
urlencoding = "2"
roxmltree = "0.21"
tokio = { version = "1", features = ["net", "time", "io-util"] }
tauri-plugin-updater = "2"
keyring = "4"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tauri-plugin-notification = "2"

[features]
# Release builds with auto-update: `tauri build --features updater --config src-tauri/tauri.release.conf.json`.
# Without it the updater plugin is not started, so dev and plain builds need no keys.
updater = []

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"
