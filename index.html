<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worklog Tracker</title>
    <script>
      // Set the saved theme before the first paint, otherwise the window flashes in the default colours.
      try { var t = localStorage.getItem("worklog.theme"); if (t && t !== "system") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-busy="true"><span class="boot-name">Worklog Tracker</span><span class="boot-bar"><i></i></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
